<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doctor Medicine Information Portal v2</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            medred: {
              50: '#fdecec', 100: '#f9d5d5', 500: '#e53935', 600: '#c62828', 700: '#a61b1b', 900: '#691212'
            }
          }
        }
      }
    }
  </script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; transition: background-color 0.2s ease, color 0.2s ease; }
    .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(16px); border: 1px solid #e5e7eb; }
    .dark .glass-panel { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glass-card { background: #ffffff; border: 1px solid #e5e7eb; box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05); transition: all 0.2s ease-in-out; }
    .glass-card:hover { border-color: rgba(198, 40, 40, 0.4); box-shadow: 0 10px 25px -5px rgba(198, 40, 40, 0.1); }
    .dark .glass-card { background: rgba(31, 41, 55, 0.6); border: 1px solid rgba(255, 255, 255, 0.07); box-shadow: none; }
    .reduce-motion * { animation: none !important; transition: none !important; }

    /* Font Scale Engine */
    html.font-scale-small, html.font-scale-small body { font-size: 13px !important; }
    html.font-scale-small p, html.font-scale-small span, html.font-scale-small button, html.font-scale-small td, html.font-scale-small input, html.font-scale-small h1, html.font-scale-small h2, html.font-scale-small h3 { font-size: 85% !important; }
    
    html.font-scale-large, html.font-scale-large body { font-size: 18.5px !important; }
    html.font-scale-large p, html.font-scale-large span, html.font-scale-large button, html.font-scale-large td, html.font-scale-large input, html.font-scale-large h1, html.font-scale-large h2, html.font-scale-large h3 { font-size: 118% !important; }

    /* High Contrast Clinical Readability Mode */
    html.high-contrast { filter: contrast(140%); }
    html.high-contrast body { font-weight: 600 !important; }
    html.high-contrast p, html.high-contrast span, html.high-contrast h1, html.high-contrast h2, html.high-contrast h3, html.high-contrast h4, html.high-contrast label, html.high-contrast th, html.high-contrast td {
      color: #000000 !important;
      font-weight: 700 !important;
    }
    html.dark.high-contrast p, html.dark.high-contrast span, html.dark.high-contrast h1, html.dark.high-contrast h2, html.dark.high-contrast h3, html.dark.high-contrast h4, html.dark.high-contrast label, html.dark.high-contrast th, html.dark.high-contrast td {
      color: #FFFFFF !important;
      font-weight: 700 !important;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const INITIAL_COMPANIES = [
      { id: 1, companyName: "Sun Pharma", medicineCount: 2, mrs: [{ id: 1, mrName: "Rahul Sharma", contactNumber: "+91 98765 43210" }] },
      { id: 2, companyName: "Cipla", medicineCount: 2, mrs: [{ id: 3, mrName: "Suman Das", contactNumber: "+91 98123 45678" }] },
      { id: 3, companyName: "Mankind Pharma", medicineCount: 2, mrs: [{ id: 4, mrName: "Priya Verma", contactNumber: "+91 97890 12345" }] },
      { id: 4, companyName: "Torrent Pharmaceuticals", medicineCount: 2, mrs: [{ id: 5, mrName: "Vikram Mehta", contactNumber: "+91 99001 12233" }] },
      { id: 5, companyName: "Lupin Limited", medicineCount: 1, mrs: [{ id: 6, mrName: "Ananya Sen", contactNumber: "+91 98334 55667" }] },
      { id: 6, companyName: "Dr. Reddy's Laboratories", medicineCount: 1, mrs: [{ id: 7, mrName: "Rohan Kapoor", contactNumber: "+91 91234 56789" }] }
    ];

    const INITIAL_MEDICINES = [
      { id: 1, medicineName: "Volini Gel 50g", companyId: 1, companyName: "Sun Pharma", composition: "Diclofenac Diethylamine 1.16% w/w, Linseed Oil 3.0% w/w, Methyl Salicylate 10.0% w/w, Menthol 5.0% w/w", description: "Topical analgesic gel for joint pain, neck pain, and muscle sprains.", mrName: "Rahul Sharma", mrContact: "+91 98765 43210", createdAt: "2026-08-12T10:00:00" },
      { id: 2, medicineName: "Pantocid D SR", companyId: 1, companyName: "Sun Pharma", composition: "Pantoprazole 40mg + Domperidone 30mg", description: "Sustained release capsule used to treat GERD and acid peptic disorders.", mrName: "Rahul Sharma", mrContact: "+91 98765 43210", createdAt: "2026-08-11T14:30:00" },
      { id: 3, medicineName: "Ciplox 500", companyId: 2, companyName: "Cipla", composition: "Ciprofloxacin Hydrochloride 500mg", description: "Broad-spectrum fluoroquinolone antibiotic prescribed for bacterial infections.", mrName: "Suman Das", mrContact: "+91 98123 45678", createdAt: "2026-08-10T09:15:00" },
      { id: 4, medicineName: "Foracort 200 Inhaler", companyId: 2, companyName: "Cipla", composition: "Budesonide 200mcg + Formoterol Fumarate 6mcg", description: "Inhalation aerosol for maintenance treatment of asthma and COPD.", mrName: "Suman Das", mrContact: "+91 98123 45678", createdAt: "2026-08-09T16:20:00" },
      { id: 5, medicineName: "Moxikind-CV 625", companyId: 3, companyName: "Mankind Pharma", composition: "Amoxicillin Trihydrate 500mg + Potassium Clavulanate 125mg", description: "Beta-lactamase inhibitor combination antibiotic for resistant bacterial infections.", mrName: "Priya Verma", mrContact: "+91 97890 12345", createdAt: "2026-08-08T11:45:00" },
      { id: 6, medicineName: "Shelcal 500", companyId: 4, companyName: "Torrent Pharmaceuticals", composition: "Elemental Calcium 500mg + Vitamin D3 250 IU", description: "Bone health dietary supplement prescribed for osteoporosis and calcium deficiency.", mrName: "Vikram Mehta", mrContact: "+91 99001 12233", createdAt: "2026-08-07T13:10:00" }
    ];

    const INITIAL_DOCUMENTS = [
      { id: 1, fileName: "SunPharma_Brochure_Aug2026.pdf", fileType: "application/pdf", fileSize: 1048576, processingStatus: "CONFIRMED", uploadDate: "2026-08-12T10:00:00" },
      { id: 2, fileName: "Cipla_Respiratory_Guide.pdf", fileType: "application/pdf", fileSize: 2097152, processingStatus: "CONFIRMED", uploadDate: "2026-08-10T09:15:00" },
      { id: 3, fileName: "Mankind_AntiInfective_Detailer.png", fileType: "image/png", fileSize: 524288, processingStatus: "CONFIRMED", uploadDate: "2026-08-08T11:45:00" }
    ];

    function App() {
      // Doctor Profile & Token State
      const [doctor, setDoctor] = useState(() => {
        const stored = localStorage.getItem('portal_doctor_v2');
        return stored ? JSON.parse(stored) : { 
          id: 1, 
          name: "Dr. Rupak Biswas", 
          email: "doctor@example.com", 
          phone: "+91 98765 43210", 
          profilePictureUrl: null,
          themePreference: "LIGHT",
          reduceMotion: false
        };
      });
      const [token, setToken] = useState(() => localStorage.getItem('portal_token') || 'demo_jwt_token_12345');

      // Zoom Modal State
      const [zoomModalOpen, setZoomModalOpen] = useState(false);
      const [viewingMedicineDoc, setViewingMedicineDoc] = useState(null);
      const [viewingArchiveDoc, setViewingArchiveDoc] = useState(null);

      // Permanent Saved Appearance States
      const [savedThemeMode, setSavedThemeMode] = useState(() => doctor.themePreference || 'LIGHT');
      const [savedFontSizeScale, setSavedFontSizeScale] = useState(() => doctor.fontSizeScale || 'NORMAL'); // 'SMALL', 'NORMAL', 'LARGE'
      const [savedHighContrast, setSavedHighContrast] = useState(() => !!doctor.highContrast);
      const [reduceMotion, setReduceMotion] = useState(() => !!doctor.reduceMotion);

      // Live Instant Preview Appearance States (User sees live difference immediately on screen)
      const [previewThemeMode, setPreviewThemeMode] = useState(() => doctor.themePreference || 'LIGHT');
      const [previewFontSizeScale, setPreviewFontSizeScale] = useState(() => doctor.fontSizeScale || 'NORMAL');
      const [previewHighContrast, setPreviewHighContrast] = useState(() => !!doctor.highContrast);
      const [appearanceSavedMsg, setAppearanceSavedMsg] = useState('');

      // Data Persistence State
      const [companies, setCompanies] = useState(() => JSON.parse(localStorage.getItem('portal_companies')) || INITIAL_COMPANIES);
      const [medicines, setMedicines] = useState(() => JSON.parse(localStorage.getItem('portal_medicines')) || INITIAL_MEDICINES);
      const [documents, setDocuments] = useState(() => JSON.parse(localStorage.getItem('portal_documents')) || INITIAL_DOCUMENTS);
      const [favoriteMrIds, setFavoriteMrIds] = useState(() => JSON.parse(localStorage.getItem('portal_fav_mr_ids')) || [1, 3]);

      // Navigation & Dropdown State
      const [currentView, setCurrentView] = useState('dashboard'); // 'dashboard', 'medicines', 'upload', 'companies', 'documents', 'favorites', 'profile', 'settings'
      const [settingsTab, setSettingsTab] = useState('appearance'); // 'account', 'appearance', 'notifications', 'privacy', 'preferences', 'data', 'about'
      const [profileDropdownOpen, setProfileDropdownOpen] = useState(false);
      const [notificationsOpen, setNotificationsOpen] = useState(false);

      // Interactive Notifications & Preferences State
      const [notificationsList, setNotificationsList] = useState([
        { id: 1, title: 'Document Processed', message: 'SunPharma_Brochure_Aug2026.pdf verified & saved.', read: false, time: '10m ago' },
        { id: 2, title: 'OCR Extraction Ready', message: 'Mankind_AntiInfective_Detailer.png extracted 2 medicines.', read: false, time: '1h ago' }
      ]);

      const [notifSettings, setNotifSettings] = useState({
        documentAlerts: true,
        reviewReminders: true,
        securityAlerts: true
      });

      // Filter & Search States
      const [globalSearch, setGlobalSearch] = useState('');
      const [companyFilter, setCompanyFilter] = useState('');
      const [fromDate, setFromDate] = useState('');
      const [toDate, setToDate] = useState('');
      const [selectedMedicineId, setSelectedMedicineId] = useState(null);

      // Upload State
      const [uploadStep, setUploadStep] = useState('UPLOAD');
      const [selectedFile, setSelectedFile] = useState(null);
      const [uploadStatus, setUploadStatus] = useState('');
      const [extractedData, setExtractedData] = useState({ companyName: '', mrName: '', mrContact: '', medicines: [] });

      // Auto-discard unsaved live preview effects when navigating away from Appearance tab
      useEffect(() => {
        if (currentView !== 'settings' || settingsTab !== 'appearance') {
          setPreviewThemeMode(savedThemeMode);
          setPreviewFontSizeScale(savedFontSizeScale);
          setPreviewHighContrast(savedHighContrast);
        }
      }, [currentView, settingsTab, savedThemeMode, savedFontSizeScale, savedHighContrast]);

      // Theme application & font scale listener (Listens to preview state so user sees instant live difference)
      useEffect(() => {
        const root = document.documentElement;
        let isDark = false;
        if (previewThemeMode === 'DARK') isDark = true;
        else if (previewThemeMode === 'LIGHT') isDark = false;
        else if (previewThemeMode === 'SYSTEM') isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        if (isDark) root.classList.add('dark');
        else root.classList.remove('dark');

        if (reduceMotion) root.classList.add('reduce-motion');
        else root.classList.remove('reduce-motion');

        // Font scale classes
        root.classList.remove('font-scale-small', 'font-scale-large');
        if (previewFontSizeScale === 'SMALL') {
          root.classList.add('font-scale-small');
        } else if (previewFontSizeScale === 'LARGE') {
          root.classList.add('font-scale-large');
        }

        // High contrast class
        if (previewHighContrast) {
          root.classList.add('high-contrast');
        } else {
          root.classList.remove('high-contrast');
        }
      }, [previewThemeMode, reduceMotion, previewFontSizeScale, previewHighContrast]);

      useEffect(() => { localStorage.setItem('portal_doctor_v2', JSON.stringify(doctor)); }, [doctor]);
      useEffect(() => { localStorage.setItem('portal_companies', JSON.stringify(companies)); }, [companies]);
      useEffect(() => { localStorage.setItem('portal_medicines', JSON.stringify(medicines)); }, [medicines]);
      useEffect(() => { localStorage.setItem('portal_documents', JSON.stringify(documents)); }, [documents]);
      useEffect(() => { localStorage.setItem('portal_fav_mr_ids', JSON.stringify(favoriteMrIds)); }, [favoriteMrIds]);
      useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

      const getInitials = (name) => {
        if (!name) return 'DR';
        const parts = name.replace(/^Dr\.\s*/i, '').trim().split(' ');
        if (parts.length >= 2) return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
        return parts[0].substring(0, 2).toUpperCase();
      };

      const handleToggleFavorite = (mrId) => {
        if (favoriteMrIds.includes(mrId)) {
          setFavoriteMrIds(favoriteMrIds.filter(id => id !== mrId));
        } else {
          setFavoriteMrIds([...favoriteMrIds, mrId]);
        }
      };

      const processFileExtraction = (file) => {
        setSelectedFile(file);
        setUploadStep('PROCESSING');
        setUploadStatus('Uploading file to protected server storage...');

        setTimeout(() => setUploadStatus('Executing OCR text extraction pipeline...'), 800);
        setTimeout(() => setUploadStatus('AI model analyzing structured pharmaceutical fields...'), 1800);

        setTimeout(() => {
          const cleanName = file.name.replace(/\.[^/.]+$/, "").replace(/_/g, " ").replace(/-/g, " ");
          let comp = "Sun Pharma"; let mr = "Rahul Sharma"; let phone = "+91 98765 43210";
          if (cleanName.toLowerCase().includes("cipla")) { comp = "Cipla"; mr = "Suman Das"; phone = "+91 98123 45678"; }
          else if (cleanName.toLowerCase().includes("mankind")) { comp = "Mankind Pharma"; mr = "Priya Verma"; phone = "+91 97890 12345"; }

          setExtractedData({
            companyName: comp,
            mrName: mr,
            mrContact: phone,
            medicines: [{ id: 1, medicineName: cleanName, composition: "Extracted chemical details", description: "Indications and clinical usage details extracted from MR brochure.", confidence: 0.92 }]
          });
          setUploadStep('VERIFY');
        }, 2800);
      };

      const handleConfirmSave = () => {
        const docId = Date.now();
        setDocuments([{ id: docId, fileName: selectedFile ? selectedFile.name : "Document.pdf", fileType: selectedFile ? selectedFile.type : "application/pdf", fileSize: selectedFile ? selectedFile.size : 102400, processingStatus: "CONFIRMED", uploadDate: new Date().toISOString() }, ...documents]);
        const newMeds = extractedData.medicines.map((m, idx) => ({ id: Date.now() + idx, medicineName: m.medicineName, companyId: 1, companyName: extractedData.companyName, composition: m.composition, description: m.description, mrName: extractedData.mrName, mrContact: extractedData.mrContact, createdAt: new Date().toISOString() }));
        setMedicines([...newMeds, ...medicines]);
        setUploadStep('SUCCESS');
      };

      const [authMode, setAuthMode] = useState('login'); // 'login', 'signup', or 'forgot'
      const [regName, setRegName] = useState('Dr. Rupak Biswas');
      const [regEmail, setRegEmail] = useState('doctor@example.com');
      const [regPhone, setRegPhone] = useState('+91 98765 43210');
      const [regPassword, setRegPassword] = useState('password123');

      // Forgot Password OTP State
      const [forgotStep, setForgotStep] = useState(1); // 1: Send OTP, 2: Verify OTP, 3: Reset Password
      const [forgotPhoneInput, setForgotPhoneInput] = useState('+91 98765 43210');
      const [forgotOtpInput, setForgotOtpInput] = useState('');
      const [resetNewPassword, setResetNewPassword] = useState('');
      const [resetConfirmPassword, setResetConfirmPassword] = useState('');
      const [otpSentNotice, setOtpSentNotice] = useState(false);
      const [otpSuccessMsg, setOtpSuccessMsg] = useState('');

      // Account Selector Lightbox Modal States
      const [googleModalOpen, setGoogleModalOpen] = useState(false);
      const [msModalOpen, setMsModalOpen] = useState(false);
      const [showCustomGmail, setShowCustomGmail] = useState(false);
      const [customGmail, setCustomGmail] = useState('');
      const [customGmailName, setCustomGmailName] = useState('');

      if (!token) {
        return (
          <div className="min-h-screen flex items-center justify-center p-6 bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 transition-colors">
            <div className="glass-panel p-8 md:p-10 rounded-3xl max-w-md w-full border border-slate-200 dark:border-slate-800 text-center shadow-2xl space-y-6">
              
              {/* Header */}
              <div>
                <div className="w-14 h-14 rounded-2xl bg-medred-600 text-white flex items-center justify-center mx-auto mb-3 shadow-lg shadow-medred-600/20">
                  <i data-lucide="cross" className="w-7 h-7"></i>
                </div>
                <h1 className="text-2xl font-extrabold text-slate-900 dark:text-slate-100">
                  {authMode === 'signup' ? 'Doctor Registration' : authMode === 'forgot' ? 'Reset Password' : 'Doctor Portal Login'}
                </h1>
                <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">
                  {authMode === 'signup' 
                    ? 'First-time doctor user registration' 
                    : authMode === 'forgot' 
                    ? 'Verify registered mobile OTP to recover account' 
                    : 'Medical Representative Information System'}
                </p>
              </div>

              {/* FORGOT PASSWORD OTP VIEW */}
              {authMode === 'forgot' ? (
                <div className="space-y-4 text-left">
                  {otpSuccessMsg && (
                    <div className="p-3 rounded-xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 text-emerald-600 dark:text-emerald-400 text-xs font-bold">
                      {otpSuccessMsg}
                    </div>
                  )}

                  {forgotStep === 1 && (
                    <form 
                      onSubmit={e => {
                        e.preventDefault();
                        setOtpSentNotice(true);
                        setForgotStep(2);
                      }}
                      className="space-y-4"
                    >
                      <div>
                        <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">
                          Registered Mobile Number <span className="text-medred-600 font-extrabold">*</span>
                        </label>
                        <input 
                          type="tel" 
                          value={forgotPhoneInput}
                          onChange={e => setForgotPhoneInput(e.target.value)}
                          placeholder="+91 98765 43210"
                          className="w-full bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-900 dark:text-slate-100"
                          required 
                        />
                        <p className="text-[11px] text-slate-400 mt-1">An SMS verification code will be sent to this phone number.</p>
                      </div>

                      <button type="submit" className="w-full bg-medred-600 hover:bg-medred-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-medred-600/20 transition-all flex items-center justify-center gap-2">
                        <i data-lucide="send" className="w-4 h-4"></i> Send OTP to Mobile Number
                      </button>

                      <div className="text-center pt-2">
                        <button type="button" onClick={() => setAuthMode('login')} className="text-xs font-bold text-slate-500 hover:text-slate-700 dark:hover:text-slate-300">
                          ← Back to Login
                        </button>
                      </div>
                    </form>
                  )}

                  {forgotStep === 2 && (
                    <form 
                      onSubmit={e => {
                        e.preventDefault();
                        if (forgotOtpInput.trim() === '482910' || forgotOtpInput.length === 6) {
                          setForgotStep(3);
                        } else {
                          alert('Invalid OTP code. Please enter 482910.');
                        }
                      }}
                      className="space-y-4"
                    >
                      <div className="p-3 bg-medred-50 dark:bg-medred-950/30 border border-medred-100 dark:border-medred-900/40 rounded-2xl text-xs space-y-1">
                        <p className="font-bold text-slate-900 dark:text-slate-100">OTP Sent via SMS!</p>
                        <p className="text-slate-600 dark:text-slate-400 text-[11px]">Sent 6-digit OTP code to {forgotPhoneInput}. (Default Code: <strong className="text-medred-600 font-mono text-xs">482910</strong>)</p>
                      </div>

                      <div>
                        <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">
                          Enter 6-Digit OTP Code <span className="text-medred-600 font-extrabold">*</span>
                        </label>
                        <input 
                          type="text" 
                          maxLength={6}
                          value={forgotOtpInput}
                          onChange={e => setForgotOtpInput(e.target.value)}
                          placeholder="e.g. 482910"
                          className="w-full bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-3 text-lg font-mono font-bold text-center tracking-[0.4em] text-slate-900 dark:text-slate-100"
                          required 
                        />
                      </div>

                      <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-emerald-600/20 transition-all flex items-center justify-center gap-2">
                        <i data-lucide="check-circle-2" className="w-4 h-4"></i> Verify OTP Code
                      </button>

                      <div className="flex justify-between items-center text-xs pt-1">
                        <button type="button" onClick={() => setForgotStep(1)} className="text-slate-400 hover:text-slate-600">Change Phone Number</button>
                        <button type="button" onClick={() => alert('Resent OTP code to ' + forgotPhoneInput)} className="text-medred-600 font-bold hover:underline">Resend OTP</button>
                      </div>
                    </form>
                  )}

                  {forgotStep === 3 && (
                    <form 
                      onSubmit={e => {
                        e.preventDefault();
                        if (resetNewPassword !== resetConfirmPassword) {
                          alert('New password and confirm password do not match.');
                          return;
                        }
                        setDoctor({ ...doctor, password: resetNewPassword });
                        setOtpSuccessMsg('Password reset successfully! Logging into portal...');
                        setTimeout(() => {
                          setToken('jwt_reset_password_token_123');
                        }, 800);
                      }}
                      className="space-y-4"
                    >
                      <div>
                        <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">
                          New Password <span className="text-medred-600 font-extrabold">*</span>
                        </label>
                        <input 
                          type="password" 
                          value={resetNewPassword}
                          onChange={e => setResetNewPassword(e.target.value)}
                          placeholder="Enter new strong password"
                          className="w-full bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-900 dark:text-slate-100"
                          required 
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">
                          Confirm New Password <span className="text-medred-600 font-extrabold">*</span>
                        </label>
                        <input 
                          type="password" 
                          value={resetConfirmPassword}
                          onChange={e => setResetConfirmPassword(e.target.value)}
                          placeholder="Re-enter new password"
                          className="w-full bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-900 dark:text-slate-100"
                          required 
                        />
                      </div>

                              <span className="font-bold text-slate-500 block uppercase">OCR Engine Status</span>
                              <span className="font-bold text-emerald-600">Passed High-Confidence Verification</span>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>

                    {/* Footer Actions */}
                    <div className="pt-2 flex items-center justify-between border-t border-slate-200 dark:border-slate-800">
                      <button onClick={() => alert(`Downloading raw file ${viewingArchiveDoc.fileName}...`)} className="px-4 py-2 rounded-xl bg-slate-200 dark:bg-slate-800 text-slate-800 dark:text-slate-200 text-xs font-bold hover:bg-slate-300 dark:hover:bg-slate-700 flex items-center gap-1.5">
                        <i data-lucide="download" className="w-4 h-4"></i> Download Raw File
                      </button>
                      
                      <button onClick={() => setViewingArchiveDoc(null)} className="px-5 py-2 rounded-xl bg-medred-600 text-white font-bold text-xs hover:bg-medred-700">
                        Close Raw View
                      </button>
                    </div>

                  </div>
                </div>
              )}

            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
