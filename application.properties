server.port=8080

# Spring Application Name
spring.application.name=doctor-medicine-portal-backend

# Database Configuration (MySQL default with H2 fallback)
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/doctor_medicine_portal?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=${UPLOAD_DIRECTORY:uploads}

# JWT Authentication Config
app.jwt.secret=${JWT_SECRET:9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b}
app.jwt.expiration-ms=86400000

# AI Service Configuration
app.ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
